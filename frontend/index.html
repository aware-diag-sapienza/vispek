<!DOCTYPE html>
<meta charset="UTF-8">
<html>

<head>
  <title>VisPek</title>
  <link rel="stylesheet" type="text/css" href="./web/css/style.css" />
  <link rel="stylesheet" href="./web/css/vendor/font-awesome-4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href=" https://cdn.jsdelivr.net/npm/pretty-checkbox@3.0/dist/pretty-checkbox.min.css">


  <!-- CSS -->
  <!--<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">-->
  <!-- CSS only -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">

</head>

<body>


  <div class="grid-container" id="container">
    <div class="item-navbar" id="navbar">
      <div id="logo">VISPEK</div>

      <div class="item-navbar-submenu">
        <label class="select-label">Dataset</label>
        <div class="select-menu">
          <select class="form-select form-select-sm" id="select-dataset" onchange="onChangeInputParameter()"
            aria-label=".form-select-sm example">dataset</select>
        </div>
      </div>

      <div class="item-navbar-submenu">
        <div class="select-button">
          <div class="btn-group me-2" role="group" aria-label="First group">
            <button id="start-test" type="button" class="btn btn-outline-dark" onclick="resetSelects()"><i
                class="fa fa-undo" aria-hidden="true"></i>
            </button>
            <button id="start-button" type="button" class="btn btn-outline-dark" onclick="startComputation()"><i
                class="fa fa-play" aria-hidden="true"></i>
            </button>
            <button id="pause-button" type="button" class="btn btn-outline-dark" onclick="pauseSelects()"><i
                class="fa fa-pause" aria-hidden="true"></i>
            </button>
            <button id="stop-button" type="button" class="btn btn-outline-dark" onclick="stopSelects()"><i
                class="fa fa-stop" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>



      <div class="item-navbar-submenu" style="flex: 1;">
        <!--<div class="select-button">
          <button id="clean-button" type="button" class="btn btn-circle" onclick="resetSelects()"><i class="fa fa-undo"
              aria-hidden="true"></i></button>
        </div>-->
        <label class="select-label">Init</label>
        <div class="select-menu">
          <select class="form-select form-select-sm" id="select-technique" onchange="onChangeInputParameter()"></select>
        </div>

        <label class="select-label">Runs</label>
        <div class="select-menu">
          <select class="form-select form-select-sm" id="select-partitions"
            onchange="onChangeInputParameter()"></select>
        </div>
        <label class="select-label">Clusters</label>
        <div class="select-menu">
          <select class="form-select form-select-sm" id="select-cluster" onchange="onChangeInputParameter()"></select>
        </div>
        <label class="select-label">Termination</label>
        <div class="select-menu">
          <select class="form-select form-select-sm" id="select-termination">
            <option value="fast" selected>Fast</option>
            <option value="slow">Slow</option>
            <option value="null">Complete</option>
          </select>
        </div>
        <div class="select-elbow">
          <img id="load-img" src="loading3.gif" width="30" height="30" />
          <div class="pretty p-svg p-curve">
            <input type="checkbox" id="elbowLinechartCheck" onclick="changeElbowLinechart()" />
            <div class="state p-info">
              <!-- svg path -->
              <svg class="svg svg-icon" viewBox="0 0 20 20">
                <path
                  d="M7.629,14.566c0.125,0.125,0.291,0.188,0.456,0.188c0.164,0,0.329-0.062,0.456-0.188l8.219-8.221c0.252-0.252,0.252-0.659,0-0.911c-0.252-0.252-0.659-0.252-0.911,0l-7.764,7.763L4.152,9.267c-0.252-0.251-0.66-0.251-0.911,0c-0.252,0.252-0.252,0.66,0,0.911L7.629,14.566z"
                  style="stroke: white;fill:white;"></path>
              </svg>
              <label>Clusters Interval</label>
            </div>
          </div>
        </div>
        <label class="select-label elbowParameter">k Range</label>
        <div class="select-range">
          <input type="number" class="select-menu-input form-control input-sm elbowParameter" id="select-minK-Elbow"
            min="2" value="2">
          <input type="number" class="select-menu-input form-control input-sm elbowParameter" id="select-maxK-Elbow"
            min="2" value="20">
        </div>
      </div>
      <div class="item-navbar-submenu">
        <label class="select-label">Seed </label>
        <div class="select-seed">
          <input type="text" class="select-menu-input form-control input-sm" id="select-seed"
            aria-describedby="seed_number">
        </div>
      </div>



    </div>

    <div class="item-iteration" id='iteration-info'>
      <div id="iteration-label">
        <button type="button" id="runButton" class="btn btn-outline-info" onclick="startIterations()"
          style="display: none;">
          <i class="fa fa-fast-forward"></i>RUN</button> <label></label>
      </div>
    </div>

    <div class="item-information-scatterplot-1" id="info-scatterplot-1">
      <div class="scatterplot-buttons">
        <div class="partition-label" id="partition-label-best"></div>
        <label class="select-label">Encoding</label>
        <div class="pretty p-default p-round p-fill">
          <input type="radio" id="cluster" name="plot-scatterplot" value="cluster"
            onclick="system.scatterplot.updateScatterplot();" />
          <div class="state p-info">
            <label>Clusters</label>
          </div>
        </div>

        <div class="pretty p-default p-round p-fill">
          <input type="radio" id="stability" name="plot-scatterplot" value="stability"
            onclick="system.scatterplot.updateScatterplot();" checked />
          <div class="state p-info">
            <label>Stability</label>
          </div>
        </div>
      </div>
      <div class="item-menu-scatterplot" id="info-menu-scatterplot">
        <label class="select-label">Projection</label>
        <div class="select-menu">
          <select class="form-select form-select-sm" id="select-projection" onchange="updateProjection()"></select>
        </div>
      </div>



    </div>

    <div class="item-history" id="listhistory"></div>

    <div class="item-scatterplot-1 scatter" id="id-scatterplot-1"></div>

    <div class="metrics-cont" id="metrics-table">
      <table class="table table-hover" id="table-metrics">
        <thead>
          <tr>
            <th scope="col">Metric</th>
            <th id="finalTh" scope="col" style="color: rgb(255, 0, 144);">-</th>
            <th id="compTh" class="nop" scope="col" style="color: teal;">-</th>
            <th id="deltaTh" class="delta-col nop" scope="col">&#916; wrt <span style="font-variant: small-caps;">Best</span></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row" style="color: rgb(34, 139, 69);">&darr; Inertia</th>
            <td id="ineC">--</td>
            <td id="ineE" class="nop">-</td>
            <td id="ineP" class="delta-col nop">--</td>
          </tr>
          <tr>
            <th scope="row">&darr; DB Index</th>
            <td id="dbC">-</td>
            <td id="dbE" class="nop">--</td>
            <td id="dbP" class="delta-col nop">--</td>
          </tr>
          <tr>
            <th scope="row">&uarr; Sim-Silhou</th>
            <td id="sseC">-</td>
            <td id="sseE" class="nop">--</td>
            <td id="sseP" class="delta-col nop">--</td>
          </tr>
          <tr>
            <th scope="row">&uarr; Cal-Har</th>
            <td id="chC">-</td>
            <td id="chE" class="nop">--</td>
            <td id="chP" class="delta-col nop">--</td>
          </tr>
          
          <tr>
            <th scope="row">&uarr; Dunn Index</th>
            <td id="diC">-</td>
            <td id="diE" class="nop">--</td>
            <td id="diP" class="delta-col nop">--</td>
          </tr>
        </tbody>
      </table>
      <div class="metrics-par">
        <label class="select-label" style="color: rgb(203, 28, 30);">Quality</label>
        <div class="select-menu">
          <select class="form-select form-select-sm" id="select-quality" onchange="changeQuality()">
            <option value="calinskyHarabasz">Cal-Har<i class="fas fa-sort-up"></i></option>
            <option value="dbIndex">DB Index <i class="fas fa-sort-down"></i></option>
            <option value="dunnIndex">Dunn Index <i class="fas fa-sort-up"></i></option>
            <option value="simplifiedSilhouette" selected>Simplified Silhouette <i class="fas fa-sort-up"></i>
            </option>
          </select>
        </div>
      </div>
      <div class="metrics-bottom">
        <div class="interactive-legend">
          <div class="stability-buttons">
            <div class="pretty p-svg p-round">
              <input type="checkbox" id="stable-check" onclick="system.scatterplot.updateScatterplot();"
                checked="checked" />
              <div class="state p-stable">
                <!-- svg path -->
                <svg class="svg svg-icon" viewBox="0 0 20 20">
                  <path
                    d="M7.629,14.566c0.125,0.125,0.291,0.188,0.456,0.188c0.164,0,0.329-0.062,0.456-0.188l8.219-8.221c0.252-0.252,0.252-0.659,0-0.911c-0.252-0.252-0.659-0.252-0.911,0l-7.764,7.763L4.152,9.267c-0.252-0.251-0.66-0.251-0.911,0c-0.252,0.252-0.252,0.66,0,0.911L7.629,14.566z"
                    style="stroke: white;fill:white;"></path>
                </svg>
                <label>STABLE</label>
                <text id='number-stable'>(0)</text>
              </div>
            </div>
            <div class="pretty p-svg p-round">
              <input type="checkbox" id="midstable-check" onclick="system.scatterplot.updateScatterplot();"
                checked="checked" />
              <div class="state p-mid-stable">
                <!-- svg path -->
                <svg class="svg svg-icon" viewBox="0 0 20 20">
                  <path
                    d="M7.629,14.566c0.125,0.125,0.291,0.188,0.456,0.188c0.164,0,0.329-0.062,0.456-0.188l8.219-8.221c0.252-0.252,0.252-0.659,0-0.911c-0.252-0.252-0.659-0.252-0.911,0l-7.764,7.763L4.152,9.267c-0.252-0.251-0.66-0.251-0.911,0c-0.252,0.252-0.252,0.66,0,0.911L7.629,14.566z"
                    style="stroke: white;fill:white;"></path>
                </svg>
                <label>MID-STABLE</label>
                <text id='number-midstable'>(0)</text>
              </div>
            </div>
            <div class="pretty p-svg p-round">
              <input type="checkbox" id="unstable-check" onclick="system.scatterplot.updateScatterplot();"
                checked="checked" />
              <div class="state p-unstable">
                <!-- svg path -->
                <svg class="svg svg-icon" viewBox="0 0 20 20">
                  <path
                    d="M7.629,14.566c0.125,0.125,0.291,0.188,0.456,0.188c0.164,0,0.329-0.062,0.456-0.188l8.219-8.221c0.252-0.252,0.252-0.659,0-0.911c-0.252-0.252-0.659-0.252-0.911,0l-7.764,7.763L4.152,9.267c-0.252-0.251-0.66-0.251-0.911,0c-0.252,0.252-0.252,0.66,0,0.911L7.629,14.566z"
                    style="stroke: white;fill:white;"></path>
                </svg>
                <label>UNSTABLE</label>
                <text id='number-unstable'>(0)</text>

              </div>
            </div>
          </div>
        </div>
        <div class="metrics-sec">
          <div class="metrics-par">
            <label class="select-label" style="color: steelblue;">Stability Window</label>
            <div class="select-menu">
              <select class="form-select form-select-sm" id="select-window-stability"
                onchange="changeStabilityWindow()">
                <option value="2">2</option>
                <option value="3" selected>3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="all">all</option>
              </select>
            </div>
          </div>
        </div>
      </div>


    </div>

    <div class="item-linechart-1" id="linechart_inertia">
      <div class="item-linechart-overlay">
        <div class="scatterplot-buttons">
          <div class="pretty p-svg p-curve">
            <input type="checkbox" id="realtiveYScaleLinechart" onclick="changeRelativeYScale()" />
            <div class="state p-info">
              <!-- svg path -->
              <svg class="svg svg-icon" viewBox="0 0 20 20">
                <path
                  d="M7.629,14.566c0.125,0.125,0.291,0.188,0.456,0.188c0.164,0,0.329-0.062,0.456-0.188l8.219-8.221c0.252-0.252,0.252-0.659,0-0.911c-0.252-0.252-0.659-0.252-0.911,0l-7.764,7.763L4.152,9.267c-0.252-0.251-0.66-0.251-0.911,0c-0.252,0.252-0.252,0.66,0,0.911L7.629,14.566z"
                  style="stroke: white;fill:white;"></path>
              </svg>
              <label>Relative scales</label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="item-information">
      <div class="scatterplot-buttons">
        <div class="partition-label" id="partition-label-comp"></div>
        <label class="select-label">Encoding</label>
        <div class="pretty p-default p-round p-fill">
          <input type="radio" id="cluster" name="plot-scatterplot-2" value="cluster"
            onclick="system.scatterplot.updateFromCheckboxes();" checked />
          <div class="state p-info">
            <label>Clusters</label>
          </div>
        </div>
        <!--<div class="pretty p-default p-round p-fill">
          <input type="radio" id="stability" name="plot-scatterplot-2" value="stability"
            onclick="system.scatterplotFixed.updateScatterplot();" checked />
          <div class="state p-info">
            <label>Stability</label>
          </div>
        </div>-->
        <div class="pretty p-default p-round p-fill">
          <input type="radio" id="comparison" name="plot-scatterplot-2" value="comparison"
            onclick="system.scatterplot.updateFromCheckboxes();" />
          <div class="state p-info">
            <label>Comparison</label>
          </div>
        </div>
      </div>
      <!--
      <button type="button" class="btn btn-outline-warning btn-sm" id="button-earlyTermination"
        onclick="updateEarlyTermination()">EARLY TERMINATION</button>
      <p id='information-info'></p> -->
    </div>

    <div class="item-metrics" id="id-metrics">
      <label class="select-label">Clusters Similarity</label>
      <div class="select-menu">
        <select class="form-select form-select-sm" id="select-similarity-matrix"
          onchange="changeSimilarityMetricMatrix()">
          <option value="adjustedRandScore">ARI</option>
          <option value="adjustedMutualInfoScore">AMI</option>
        </select>
      </div>
    </div>

    <div class="item-information-linechart" id="information-linechart">
      <div>
        <label class="select-label">Metrics</label>
        <div class="pretty p-default p-round p-fill">
          <input type="radio" id="inertia" name="metric-timeline" value="inertia"
            onclick="system.timelinepartitions.updateMetricValue()" checked />
          <div class="state p-info">
            <label style="color: rgb(34, 139, 69);">Inertia</label>
          </div>
        </div>

        <div class="pretty p-default p-round p-fill">
          <input type="radio" id="simplifiedSilhouette" name="metric-timeline" value="simplifiedSilhouette"
            onclick="system.timelinepartitions.updateMetricValue()" />
          <div class="state p-info">
            <label style="color: rgb(203, 28, 30);">Quality</label>
          </div>
        </div>
      </div>

      <div>
        <label class="select-label">Metric Similarity Threshold</label>
        <label id="selected_similarity">1%</label>
        <label style="padding-right: 0.2rem;">0</label>
        <input type="range" id="similarity-range" name="similarity" min="0" max="30" value="1"
          onchange="system.timelinepartitions.updateSimilarity()" />
        <label style="padding-left: 0.2rem;">30</label>
      </div>




    </div>

    <div class="item-scatterplot-2 scatter" id="id-scatterplot-2"></div>

    <div class="item-matrix-1" id="id-matrix-1"></div>

    <div class="item-timeline-partitions" id="timeline-partitions"></div>

    <div class="form-check" style="display: none;"> </div>
    <div class="item-zoom-window" id="zoom-window" style="display: none;">
      <div class="zoom-window-element" id="window-1"></div>
      <div class="zoom-window-element" id="window-2"></div>
      <div class="zoom-window-element" id="window-3"></div>
      <div class="zoom-window-element" id="window-4"></div>
      <div class="zoom-window-element" id="window-5"></div>
    </div>
    <div class="item-small-multiple" id="small-multiple" style="display: none;"></div>
    <div class="item-elbow-scatterplot-1 scatter" id="elbow-scatterplot-1" style="display: none;"></div>
    <div class="item-elbow-scatterplot-2 scatter" id="elbow-scatterplot-2" style="display: none;"></div>
    <div class="tooltipHistory" id="history-tooltip"></div>
  </div>

</body>
